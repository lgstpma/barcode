# Compensación SOLO para jobs del sistema nuevo (formatos 1 / 9 / 15).
# No se graba en la impresora (^JUS no se usa). VB6 SoftShop no lee este archivo.
#
# Unidades: dots a 203 dpi (~8 dots = 1 mm).
#   lt = Label Top   (^LT)  vertical: positivo baja el contenido, negativo sube
#   ls = Label Shift (^LS)  horizontal: positivo mueve a la derecha, negativo a la izquierda
#   lh_x, lh_y = Label Home (^LH) origen del formato (normalmente 0,0)
#
# Si el contenido sale "apiñado" o con margen de más, prueba p.ej.:
#   lt=-15
#   ls=-10
#
lt=10
ls=0
lh_x=0
lh_y=0
